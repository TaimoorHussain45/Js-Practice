<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="green">Green</button>
    <button id="yellow">Yellow</button>

    <!-- <script>
         function outer() {
            console.log("Working");
            document.getElementById("green").onclick=function inner(){
                document.body.style.backgroundColor=`green`
            }
            
         } 
    </script> -->
    <script>
      function outer(color) {
        return function inner() {
          document.body.style.backgroundColor = `${color}`;
        };
      }
      document.getElementById("green").onclick = outer("green");
      document.getElementById("yellow").onclick = outer("yellow");
    </script>
  </body>
</html>
